<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>我的信用卡比較網</title>
    <style>
        body { font-family: sans-serif; background-color: #f4f7f6; padding: 20px; }
        .card { background: white; border-radius: 10px; padding: 20px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); max-width: 300px; }
        h1 { color: #2c3e50; }
        .benefit { color: #e74c3c; font-weight: bold; }
    </style>
</head>
<body>
    <h1>我的首選信用卡</h1>
    <div class="card">
        <h2>某某銀行鑽石卡</h2>
        <p>國內消費：<span class="benefit">3% 回饋</span></p>
        <p>國外消費：<span class="benefit">5% 無上限</span></p>
        <button>查看更多細節</button>
    </div>
</body>
</html>
